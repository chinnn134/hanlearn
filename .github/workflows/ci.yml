name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked Rules test dependencies
        run: npm ci --prefix firebase
      - name: Test Firestore Rules in Emulator
        run: npx --yes firebase-tools@14.27.0 emulators:exec --only firestore --project demo-hanlearn "npm --prefix firebase run test:rules"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install locked Python dependencies
        run: python -m pip install -r backend/requirements-dev.lock
      - name: Check Python format and lint
        run: |
          ruff format --check backend
          ruff check backend
      - name: Test backend
        run: python -m pytest backend/tests -q

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - name: Resolve locked Dart dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check Dart format and analysis
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
      - name: Test Flutter
        run: flutter test
      - name: Build Web
        run: flutter build web
      - name: Build Android APK
        run: flutter build apk --debug
